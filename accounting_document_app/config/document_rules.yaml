# Luật PHÂN LOẠI chứng từ — dựa trên NỘI DUNG, không bao giờ dựa trên tên file.
#
# Cơ chế chấm điểm:
#   must_have_any   bắt buộc khớp ít nhất 1 (không khớp -> loại thẳng)
#   must_not_have   khớp bất kỳ -> loại thẳng
#   strong          mỗi mục khớp cộng 1 điểm
#   min_score       điểm tối thiểu để được chấp nhận
#
# Nếu từ 2 loại trở lên cùng đạt -> UNKNOWN + CLASSIFY_AMBIGUOUS.
# Hệ thống KHÔNG tự chọn loại có điểm cao hơn.
#
# page_start_markers: dấu hiệu MỘT CHỨNG TỪ MỚI BẮT ĐẦU tại trang này, dùng để
# tách file PDF gộp nhiều chứng từ. Chỉ được chọn chuỗi CHẮC CHẮN chỉ xuất hiện
# ở TRANG ĐẦU của chứng từ — nếu chọn nhầm chuỗi có ở trang 2 thì một chứng từ
# sẽ bị cắt đôi. Trang không có marker nào được coi là trang tiếp theo của
# chứng từ liền trước.
#
# Thêm ngân hàng / nhà cung cấp mới = thêm một khối ở đây, KHÔNG sửa code.

version: 1

# So khớp không phân biệt hoa thường; dấu tiếng Việt được giữ nguyên.
case_sensitive: false

types:

  META_INVOICE:
    description: "Hoá đơn quảng cáo Meta / Facebook Ads"
    must_have_any:
      - "Meta Platforms Ireland"
      - "Meta quảng cáo"
      - "Hóa đơn thuế cho"
    strong:
      - "Số tham chiếu:"
      - "ID giao dịch"
      - "ID tài khoản:"
      - "FBADS-"
      - "Phương thức thanh toán"
    must_not_have:
      - "PHIẾU GIAO DỊCH GHI NỢ"
      - "Ký hiệu (Serial)"
    min_score: 1
    # "Meta Platforms Ireland" KHÔNG dùng được vì nó nằm ở trang 2 của hoá đơn.
    page_start_markers:
      - "Hóa đơn thuế cho"

  VPBANK_DEBIT_NOTE:
    description: "Phiếu giao dịch ghi nợ VPBank"
    must_have_any:
      - "PHIẾU GIAO DỊCH GHI NỢ"
      - "DEBIT NOTE"
    strong:
      - "Mã giao dịch/Transaction code"
      - "Diễn giải/Details"
      - "Tài khoản nợ"
      - "Số tài khoản/Account No"
    must_not_have:
      - "Ký hiệu (Serial)"
    min_score: 1
    page_start_markers:
      - "PHIẾU GIAO DỊCH GHI NỢ"
      - "DEBIT NOTE"

  VPBANK_VAT_INVOICE:
    description: "Hoá đơn GTGT phí dịch vụ ngân hàng VPBank"
    # LƯU Ý: hoá đơn này KHÔNG chứa cụm "HÓA ĐƠN GIÁ TRỊ GIA TĂNG" hay
    # "VAT INVOICE" — đã kiểm chứng trên file mẫu. Tuyệt đối không dùng hai
    # cụm đó làm điều kiện bắt buộc.
    must_have_any:
      - "Ký hiệu (Serial)"
      - "Bản thể hiện của hóa đơn điện tử"
    strong:
      - "Nội dung thanh toán (Payment detail)"
      - "Cộng tiền hàng (Subtotal)"
      - "Tổng cộng tiền thanh toán"
      - "Ngân hàng TMCP Việt Nam Thịnh Vượng"
      - "einvoice.vpbank.com.vn"
    must_not_have:
      - "PHIẾU GIAO DỊCH GHI NỢ"
    min_score: 1
    page_start_markers:
      - "Ký hiệu (Serial)"

  VIETINBANK_DEBIT_ADVICE:
    description: "Giấy báo nợ VietinBank (một trang = một giao dịch, sau khi tách vật lý)"
    must_have_any:
      - "GIẤY BÁO NỢ"
      - "Debit Advice"
    strong:
      - "Số giao dịch"
      - "Transaction number"
      - "Ngày thực hiện"
      - "Transaction date"
      - "Số tiền bằng số"
    must_not_have:
      - "PHIẾU GIAO DỊCH GHI NỢ"
      - "Ký hiệu (Serial)"
    min_score: 1
    # CỐ Ý không khai báo page_start_markers: việc tách file gốc nhiều trang
    # (vd. giay-bao-No.pdf 48 trang) do app/core/debit_advice_splitter.py
    # đảm nhiệm RIÊNG — ghi ra file PDF vật lý một trang cho từng giao dịch
    # (xem yêu cầu nghiệp vụ §E). Nếu khai báo cả marker ở đây, file gốc sẽ
    # bị VoucherSplitter tách "ảo" một lần nữa lúc SCAN bình thường, sinh
    # chứng từ trùng lặp với các trang đã tách vật lý.

  BANK_STATEMENT:
    description: >-
      Sao kê tài khoản ngân hàng nhiều giao dịch — CHỈ dùng để định tuyến
      file sang app/core/bank_statement_parser.py, không trích xuất qua cơ
      chế rule một-giá-trị-một-chứng-từ thông thường (một file sinh ra
      NHIỀU BankTransaction, không phải một Document).
    must_have_any:
      - "SAO KÊ TÀI KHOẢN"
      - "STATEMENT OF ACCOUNT"
      - "Sao kê giao dịch"
    strong:
      - "Số dư"
      - "Running balance"
      - "Ngày giao dịch"
      - "Phát sinh Nợ"
      - "Phát sinh Có"
    must_not_have:
      - "PHIẾU GIAO DỊCH GHI NỢ"
      - "GIẤY BÁO NỢ"
    min_score: 1
