# Chính sách kế toán — ứng dụng KHÔNG tự quyết định, chỉ làm theo cấu hình.
# Các giá trị dưới đây rút ra từ FILE MISA THẬT do kế toán cung cấp.

version: 1

company:
  name: ""
  tax_code: ""              # dùng để đối chiếu TAX_CODE_MISMATCH

accounts:
  marketing_expense: "6417"   # chi phí quảng cáo (file mẫu: TK Nợ của CẢ HAI dòng)
  supplier_payable: "331"     # phải trả người bán (file mẫu: TK Có)
  bank_fee_expense: "6427"    # phí dịch vụ ngân hàng — CHỜ XÁC NHẬN
  input_vat: "1331"           # thuế GTGT đầu vào — hiện KHÔNG dùng cho Meta
  bank: "1121"                # tiền gửi ngân hàng

suppliers:
  # Đối tượng Có trên chứng từ MISA. File mẫu dùng MST Việt Nam của Meta.
  meta:
    object_code: "9000000327"
    name: "Meta Platforms Ireland Limited"

policy:
  # Hoá đơn Meta ghi rõ: Meta đã đăng ký thuế tại VN và tự nộp FCT, bên mua
  # KHÔNG khấu trừ/khấu lưu.
  withhold_foreign_contractor_tax: false

  # Q7 ĐÃ XÁC NHẬN: KHÔNG khấu trừ vào TK 1331, không kê khai thuế GTGT đầu
  # vào thông thường. Số thuế trên hoá đơn Meta được hạch toán thẳng vào
  # cùng tài khoản chi phí (6417) — đúng như file mẫu: cả hai dòng đều
  # 6417 / 331, toàn bộ nhóm cột thuế bỏ trống.
  deduct_meta_input_vat: false

  # Phí ngân hàng KHÔNG xuất hiện trong file MISA mẫu -> chưa rõ hạch toán
  # ở đâu. Tạm tắt, chờ kế toán xác nhận.
  book_bank_fee: false
  deduct_bank_fee_input_vat: false

  # LUÔN lấy số thuế in trên hoá đơn, KHÔNG tự tính subtotal * thuế suất.
  # (File mẫu có 1/64 dòng lệch so với 10% — bằng chứng nhập tay có sai sót.)
  recompute_vat_from_rate: false
